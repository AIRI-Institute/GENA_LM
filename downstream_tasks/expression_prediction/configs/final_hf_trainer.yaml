# @package _global_
defaults:
  - final
  - _self_

TASK_NAME: expression/final_hf_trainer

MODEL_PATH_ROOT: ${HOME_PATH}/runs/${TASK_NAME}

args_params:
  _target_: builtins.dict

  model_path: ${MODEL_PATH_ROOT}

  # Keep batch sizing in the launcher/CLI unless you want to freeze it here.
  # batch_size: 2
  # gradient_accumulation_steps: 20

  bf16: True
  tf32: True
  save_total_limit: 2

  # HF Trainer resume expects a checkpoint directory here.
  resume_from_checkpoint:

