TASK_NAME: expression/final_atac_egor_cell_lines_8192

HOME_PATH: ${oc.env:GENALM_HOME}

MODEL_PATH_ROOT: ${HOME_PATH}/runs/${TASK_NAME}


args_params:

  _target_: builtins.dict
  
  init_checkpoint: 

  resume: # "/external/nfs/01-home/avaspidova/runs/expression/final_ATAC/20260530-112924/checkpoint-92500/pytorch_model.bin"

  model_cfg: "./data/configs/L12-H768-A12-V32k-preln.json"

  model_cls: "downstream_tasks.expression_prediction.expression_model_final:ExpressionCounts"

  model_path: ${MODEL_PATH_ROOT}

  clip_grad_norm: 1

  input_seq_len: 8192

  optimizer: "AdamW"

  weight_decay: 1e-4

  seed: 45

  num_warmup_steps: 10000

  log_interval: 500

  valid_interval: 500

  save_best: True

  save_interval: 2500

  optimize_metric: "score_predictions_Expression_dataset_v1_GRCh38_csv dataset"

  optimize_mode: "max"

  data_n_workers: 8

  lr: 1e-4

  lr_scheduler: "constant_with_warmup"

  reset_lr: True

  reset_optimizer: True

  reset_iteration: True

  early_stopping_patience: 10000000

  iters: 3500000

  gen_tokenizer: "AIRI-Institute/gena-lm-bert-base-t2t"

  text_tokenizer: "Qwen/Qwen3-Embedding-0.6B"

 # save_predictions: True

selected_targets_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/datasets/data/ct_specific_benchmark/selected_targets.csv"

model_kwargs:
  _target_: builtins.dict 
  hf: True
  hf_model_name: "${HOME_PATH}/models/moderngena_large"
  max_position_embeddings: 8192
  max_position_embeddings_decoder: 8192
  hf_model_name_decoder: "${HOME_PATH}/models/decoderdp0.1"
  desc_model_name: "Qwen/Qwen3-Embedding-0.6B"
  
  loss_fct:
    _target_: torch.nn.MSELoss
    reduction: 'none'

  activation:
    _target_: torch.nn.Identity

  config:
    _target_: builtins.dict

  weight: 0.05

# shared dataset parameters
shared_dataset_params:
  gen_tokenizer: ${args_params.gen_tokenizer}
  text_tokenizer: ${args_params.text_tokenizer}
  text_max_seq_len: 510
  loglevel: 
    "_target_": "logging.getLevelName"
    "level": "DEBUG"
  seed: "${args_params.seed}"


#ATAC-seq
train_dataset_atac_egor_cell_lines_human:
  _target_: downstream_tasks.expression_prediction.expression_dataset_final.ExpressionDatasetFixedDesc
  forward_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.train.cre_modernbert.100k.csv"
  reverse_intervals_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/intervals/human.train.reverse.cre_modernbert.100k.csv"
  targets_path: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/datasets/data/ATACseq_Egor_cell_lines_human/file_mappings_qnorm.csv"
  genome: "${HOME_PATH}/GENA_LM/downstream_tasks/expression_prediction/datasets/data/genomes/hg38/hg38.fa"
  bw: bw
  num_before: 0
  gen_max_seq_len: 8192
  token_len_for_fetch: 15
  transform_targets_bw:
    _target_: downstream_tasks.expression_prediction.expression_dataset_final.multiplytransform
