true_test_file: "${DATA_ROOT}/test_true_mouse.csv"
true_valid_file: "${DATA_ROOT}/valid_true_mouse.csv"
output_dir: "${BENCHMARK_ROOT}/AlphaGenome/predictions/results-seq_len1Mb_json243_mouse"

genes_forward_val: "${DATA_ROOT}/mouse.valid.forward.csv"
genes_reverse_val: "${DATA_ROOT}/mouse.valid.reverse.csv"
genes_forward_test: "${DATA_ROOT}/mouse.test.forward.csv"
