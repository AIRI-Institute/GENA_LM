# Every generation-affecting setting is explicit. Local paths are resolved
# relative to this file. Replace the genome and plasmid placeholders before use.

project:
  name: example_promoter_generation

model:
  genalm_home: /workspace-SR003.nfs2/estsoi/CAGI5_benchmark
  model_cls: /workspace-SR003.nfs2/estsoi/CAGI5_benchmark/GENA_LM/downstream_tasks/expression_prediction/expression_model_final.py::ExpressionCounts
  checkpoint: /workspace-SR003.nfs2/estsoi/CAGI5_benchmark/models/expression_model_v1-1/pytorch_model.bin
  config: /workspace-SR003.nfs2/estsoi/CAGI5_benchmark/GENA_LM/downstream_tasks/expression_prediction/configs/final.yaml
  dna_tokenizer:
    path: /workspace-SR003.nfs2/estsoi/CAGI5_benchmark/GENA_LM/data/tokenizers/t2t_1000h_multi_32k
  description_tokenizer:
    identifier: Qwen/Qwen3-Embedding-0.6B
  dna_max_seq_len: 1024
  desc_max_seq_len: 510
  token_len_for_fetch: 15
  num_before: 512
  device: cuda:5
  output_names: null
  description_formatter: null

genome:
  fasta_path: /path/to/reference_genome.fa
  annotation_path: /path/to/transcripts.gtf.gz
  build: null
  chrom_style: auto
  cache: true

sampler:
  seq_len: 215
  tss_sampling_window: 1000
  seed: 42
  transcript_feature_types: null
  include_features: false
  unique_sequences: true
  max_attempts: 100000

plasmid:
  genbank_path: plasmids/plasmid.gb
  fasta_path: null
  reporter_feature_name: luc2
  replacement_feature_name: cloning site
  region_feature_name: promoter
  tokenization_center_name: reporter_tss
  circular: true
  window_size: full

conditions:
  seed: 42
  strict: true
  search_fields: null
  on_target:
    directory: on_target
    keys: [ENCFF035CWS]
    filters: {}
    key_filters: {}
  off_target:
    directory: off_target
    keys: [ENCFF083EOC]
    filters: {}
    key_filters: {}

scorer:
  type: expression
  params: {}

fitness:
  type: min_on_max_off
  params:
    on_power: 1.0
    off_power: 3.0
    off_weight: 1.0

offspring:
  type: parallel
  params:
    crossover_probability: 0.6
    mutations_per_child: 20
    random_seed: 44
    max_workers: 20
    batches_per_worker: 2

optimization:
  population_size: 800
  offspring_size: 400
  n_generations: 200
  selection_strategy: top_k
  elite_count: 1
  tournament_size: 3
  offspring_generator_mode: records
  random_seed: 42

runtime:
  evaluation_chunk_size: 600
  grouping: condition
  preprocessing_workers: 20
  preprocessing_backend: process
  max_records_per_forward: 1400
  prefetch_batches: 2
  show_progress: true

output:
  directory: results/example_run
  allow_existing: false
